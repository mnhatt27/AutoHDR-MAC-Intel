name: Build macOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'client_source/**.py'
      - 'MAC/**'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        # Each dedicated repository produces only its own architecture.
        # A differently named repository produces both.
        arch: ${{ fromJSON(github.event.repository.name == 'AutoHDR-MAC-Intel' && '["x86_64"]' || github.event.repository.name == 'AutoHDR-MAC-All-M' && '["arm64"]' || '["arm64","x86_64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Install packaging tools
        run: python -m pip install -r MAC/requirements-build.txt
      - name: Verify client behaviour
        run: python -m unittest discover -s MAC/tests -v
      - name: Package and launch the native app
        run: python MAC/build_mac.py --arch ${{ matrix.arch }}
      - name: Upload macOS release
        uses: actions/upload-artifact@v4
        with:
          name: AutoHDR-macOS-${{ matrix.arch }}
          path: |
            MAC/dist/${{ matrix.arch }}/AutoHDR-macOS-${{ matrix.arch }}.zip
            MAC/dist/${{ matrix.arch }}/AutoHDR-macOS-${{ matrix.arch }}.zip.sha256
            MAC/dist/${{ matrix.arch }}/release-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30
